<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>우리의 결혼식</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a96e;
      --cream: #faf6f0;
      --dark: #1a1a2e;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── Particle canvas ── */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      z-index: 1;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(201,169,110,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .monogram {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
      letter-spacing: 0.1em;
      animation: fadeDown 1.4s ease both;
      text-shadow: 0 0 60px rgba(201,169,110,0.4);
    }

    .ampersand {
      font-style: italic;
      opacity: 0.7;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 3vw, 1.6rem);
      color: var(--gold);
      letter-spacing: 0.25em;
      margin-top: 0.5rem;
      animation: fadeDown 1.4s 0.2s ease both;
      opacity: 0;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem auto;
      width: min(320px, 80%);
      animation: fadeIn 1.4s 0.5s ease both;
      opacity: 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
    }

    .divider-icon {
      color: var(--gold);
      font-size: 1.2rem;
    }

    .date-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 4vw, 2rem);
      letter-spacing: 0.3em;
      animation: fadeIn 1.4s 0.7s ease both;
      opacity: 0;
    }

    .location {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-top: 0.5rem;
      animation: fadeIn 1.4s 0.9s ease both;
    }

    .cta {
      margin-top: 3rem;
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeIn 1.4s 1.1s ease both;
      opacity: 0;
    }

    .btn {
      padding: 0.85rem 2.5rem;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-101%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
      z-index: -1;
    }

    .btn:hover { color: var(--dark); transform: translateY(-2px); }
    .btn:hover::before { transform: translateX(0); }

    /* ── Countdown ── */
    .countdown-section {
      position: relative;
      z-index: 1;
      padding: 6rem 2rem;
      text-align: center;
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(201,169,110,0.15);
      border-bottom: 1px solid rgba(201,169,110,0.15);
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: clamp(1rem, 5vw, 4rem);
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .countdown-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 300;
      line-height: 1;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(201,169,110,0.3);
    }

    .countdown-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    /* ── Story section ── */
    .story-section {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 7rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    @media (max-width: 640px) {
      .story-section { grid-template-columns: 1fr; gap: 2rem; }
    }

    .story-image {
      aspect-ratio: 3/4;
      background: linear-gradient(135deg, rgba(201,169,110,0.2), rgba(201,169,110,0.05));
      border: 1px solid rgba(201,169,110,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: rgba(201,169,110,0.5);
      letter-spacing: 0.15em;
    }

    .story-text h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3rem);
      color: var(--gold);
      margin-bottom: 1.5rem;
      line-height: 1.2;
    }

    .story-text p {
      line-height: 1.9;
      opacity: 0.7;
      font-size: 0.9rem;
    }

    /* ── Timeline ── */
    .timeline-section {
      position: relative;
      z-index: 1;
      padding: 6rem 2rem;
      text-align: center;
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(201,169,110,0.1);
    }

    .timeline-section h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3rem);
      color: var(--gold);
      margin-bottom: 4rem;
    }

    .timeline {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      transform: translateX(-50%);
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 1fr 2rem 1fr;
      gap: 1rem;
      align-items: start;
      margin-bottom: 3rem;
    }

    .timeline-left { text-align: right; }
    .timeline-right { text-align: left; }

    .timeline-dot {
      width: 10px;
      height: 10px;
      border: 1px solid var(--gold);
      background: var(--dark);
      border-radius: 50%;
      margin: 0.35rem auto 0;
      box-shadow: 0 0 10px rgba(201,169,110,0.4);
    }

    .timeline-time {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .timeline-event {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      opacity: 0.85;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 2rem;
      border-top: 1px solid rgba(201,169,110,0.15);
    }

    footer .monogram {
      font-size: clamp(2rem, 8vw, 5rem);
      animation: none;
      text-shadow: none;
    }

    footer p {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      opacity: 0.4;
      margin-top: 1rem;
    }

    /* ── Animations ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- Hero -->
<section class="hero">
  <div class="monogram">A <span class="ampersand">&</span> B</div>
  <div class="tagline">영원히 함께</div>
  <div class="divider"><span class="divider-icon">&#9670;</span></div>
  <div class="date-text">2026년 9월 20일</div>
  <p class="location">그랜드 볼룸 &bull; 더 팰리스 호텔 &bull; 샌프란시스코</p>
  <div class="cta">
    <a href="#" class="btn">참석 여부 회신</a>
    <a href="#" class="btn">우리의 이야기</a>
  </div>
</section>

<!-- Countdown -->
<section class="countdown-section">
  <p class="section-label">결혼식까지</p>
  <h2 style="font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.5rem,4vw,2.5rem);color:var(--gold)">디데이</h2>
  <div class="countdown">
    <div class="countdown-item">
      <span class="countdown-number" id="cd-days">000</span>
      <span class="countdown-label">일</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-number" id="cd-hours">00</span>
      <span class="countdown-label">시간</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-number" id="cd-mins">00</span>
      <span class="countdown-label">분</span>
    </div>
    <div class="countdown-item">
      <span class="countdown-number" id="cd-secs">00</span>
      <span class="countdown-label">초</span>
    </div>
  </div>
</section>

<!-- Timeline -->
<section class="timeline-section">
  <h2 class="reveal">행사 일정</h2>
  <div class="timeline">
    <div class="timeline-item reveal">
      <div class="timeline-left"><p class="timeline-time">오후 3:00</p><p class="timeline-event">하객 입장 및 웰컴 드링크</p></div>
      <div><div class="timeline-dot"></div></div>
      <div class="timeline-right"></div>
    </div>
    <div class="timeline-item reveal">
      <div class="timeline-left"></div>
      <div><div class="timeline-dot"></div></div>
      <div class="timeline-right"><p class="timeline-time">오후 4:00</p><p class="timeline-event">결혼 예식</p></div>
    </div>
    <div class="timeline-item reveal">
      <div class="timeline-left"><p class="timeline-time">오후 5:00</p><p class="timeline-event">칵테일 타임</p></div>
      <div><div class="timeline-dot"></div></div>
      <div class="timeline-right"></div>
    </div>
    <div class="timeline-item reveal">
      <div class="timeline-left"></div>
      <div><div class="timeline-dot"></div></div>
      <div class="timeline-right"><p class="timeline-time">오후 7:00</p><p class="timeline-event">피로연 및 축하 만찬</p></div>
    </div>
    <div class="timeline-item reveal">
      <div class="timeline-left"><p class="timeline-time">오후 11:00</p><p class="timeline-event">피날레</p></div>
      <div><div class="timeline-dot"></div></div>
      <div class="timeline-right"></div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <div class="monogram">A <span class="ampersand">&</span> B</div>
  <p>사랑을 담아 &bull; 2026년 11월 7일</p>
</footer>

<script>
  // ── Floating particles ──
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  class Particle {
    constructor() { this.reset(true); }
    reset(init) {
      this.x = Math.random() * W;
      this.y = init ? Math.random() * H : H + 10;
      this.r = Math.random() * 2 + 0.5;
      this.speed = Math.random() * 0.4 + 0.15;
      this.drift = (Math.random() - 0.5) * 0.3;
      this.alpha = Math.random() * 0.5 + 0.1;
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = Math.random() * 0.01 + 0.005;
    }
    update() {
      this.wobble += this.wobbleSpeed;
      this.x += this.drift + Math.sin(this.wobble) * 0.4;
      this.y -= this.speed;
      if (this.y < -10) this.reset(false);
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(201,169,110,${this.alpha})`;
      ctx.fill();
    }
  }

  function initParticles() {
    particles = Array.from({ length: 80 }, () => new Particle());
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animate);
  }

  resize();
  initParticles();
  animate();
  window.addEventListener('resize', () => { resize(); });

  // ── Countdown ──
  const target = new Date('2026-11-07T16:00:00');
  function updateCountdown() {
    const now = new Date();
    const diff = target - now;
    if (diff <= 0) {
      document.getElementById('cd-days').textContent = '000';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-days').textContent  = String(d).padStart(3, '0');
    document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
    document.getElementById('cd-mins').textContent  = String(m).padStart(2, '0');
    document.getElementById('cd-secs').textContent  = String(s).padStart(2, '0');
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ── Scroll reveal ──
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.15 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
</body>
</html>
